# =============================================================
#  Cấu hình nguồn RSS cho bản tin hằng ngày
#  Sửa file này để thêm/bớt nguồn — không cần đụng vào code.
#  lang: en | ja   (dùng để hiển thị nhãn ngôn ngữ trong email)
#  enabled: false  -> tạm tắt một nguồn mà không cần xoá
# =============================================================

settings:
  timezone: Asia/Tokyo        # Múi giờ dùng để tính "24 giờ qua" và hiển thị ngày
  window_hours: 24            # Chỉ lấy bài đăng trong N giờ gần nhất
  max_items_per_feed: 6       # Trần số bài lấy từ mỗi nguồn
  max_items_per_topic: 15     # Trần số bài mỗi chủ đề trong email
  summary_length: 180         # Độ dài tối đa phần mô tả ngắn (ký tự)
  fetch_timeout: 20           # Timeout mỗi request (giây)
  send_when_empty: false      # true = vẫn gửi mail kể cả khi không có tin mới

# Bộ lọc từ khoá áp dụng cho TOÀN BỘ nguồn (không phân biệt hoa/thường).
# include rỗng = nhận tất cả. exclude luôn được ưu tiên.
filters:
  include: []
  exclude:
    - "PR TIMES"
    - "セール"          # tin khuyến mãi
    - "Amazonタイムセール"
    - "sponsored"
    - "deal of the day"

